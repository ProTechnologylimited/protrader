services:
  - type: web
    name: protrader-public-beta
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: protrader-community-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_DB_PATH
        value: /var/data/protrader.sqlite
      - key: SESSION_SECRET
        generateValue: true
      - key: RPC_URL
        sync: false
      - key: DEPOSIT_WALLET_ADDRESS
        sync: false
